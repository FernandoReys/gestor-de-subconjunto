name: Windows Desktop
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/feature/windows-desktop-offline'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Test persistence, PostgreSQL CAS and existing features
        run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Rebuild SQLite for Electron
        run: npm run desktop:rebuild
      - name: Smoke test actual Electron runtime
        run: npm run test:electron
      - name: Build Windows x64 NSIS installer
        run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify agenda inside packaged application
        shell: pwsh
        run: |
          $env:GESTOR_PACKAGED_MAIN = Join-Path $PWD 'release/win-unpacked/resources/app.asar/desktop/main.cjs'
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { throw 'Packaged agenda check failed' }
      - name: Verify executable and record SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*Setup.exe
          if ($installer.Count -ne 1) { throw 'Installer missing or ambiguous' }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Out-File release/SHA256SUMS.txt -Encoding utf8
          Get-AuthenticodeSignature $installer.FullName | Format-List Status,StatusMessage
      - name: Install, launch and uninstall the generated installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*Setup.exe).FullName
          $testInstallPath = Join-Path $env:RUNNER_TEMP 'GestorInstalledCheck'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$testInstallPath") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installer execution failed' }
          $installedExecutable = Join-Path $testInstallPath 'Gestor de Subconjunto.exe'
          if (!(Test-Path $installedExecutable)) { throw 'Installed executable missing' }
          $expectedVersion = (Get-Content package.json | ConvertFrom-Json).version
          $actualVersion = (Get-Item $installedExecutable).VersionInfo.ProductVersion
          if (!$actualVersion.StartsWith($expectedVersion)) { throw 'Installed application version differs' }
          $launched = Start-Process -FilePath $installedExecutable -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            Start-Sleep -Milliseconds 500
            $launched.Refresh()
            if ($launched.HasExited) { throw 'Installed application exited before showing its window' }
            if ($launched.MainWindowHandle -ne 0) { $ready = $true; break }
          }
          if (!$ready) { Stop-Process -Id $launched.Id -Force; throw 'Installed application window did not open' }
          Stop-Process -Id $launched.Id -Force
          $uninstaller = Get-ChildItem $testInstallPath -Filter '*Uninstall*.exe'
          if ($uninstaller.Count -ne 1) { throw 'Uninstaller missing or ambiguous' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw 'Uninstaller execution failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Gestor-Windows-x64-${{ github.sha }}
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
            verification/agenda-windows.png
          if-no-files-found: error
          retention-days: 30
