name: Windows Desktop
on:
  push:
    branches: [feature/windows-desktop-offline]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: github.ref == 'refs/heads/feature/windows-desktop-offline'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Test persistence, PostgreSQL CAS and existing features
        run: npm test
      - run: npm run build
      - name: Rebuild SQLite for Electron
        run: npm run desktop:rebuild
      - name: Smoke test actual Electron runtime
        run: npm run test:electron
      - name: Build Windows x64 NSIS installer
        run: npm run desktop:pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify executable and record SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*Setup.exe
          if ($installer.Count -ne 1) { throw 'Installer missing or ambiguous' }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Out-File release/SHA256SUMS.txt -Encoding utf8
          Get-AuthenticodeSignature $installer.FullName | Format-List Status,StatusMessage
      - uses: actions/upload-artifact@v4
        with:
          name: Gestor-Windows-x64-${{ github.sha }}
          path: |
            release/*Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
