name: Web validation
on:
  push:
    branches: [feature/windows-desktop-offline]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node node_modules/electron/install.js
      - run: npx electron tests/web-ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Web-visual-checks-${{ github.sha }}
          path: verification/web-*.png
          if-no-files-found: error
          retention-days: 14
